[package]
name    = "core-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dashmap.workspace = true
indexmap.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true

# `SystemTime::now()` is unsupported on wasm32-unknown-unknown and panics. This
# crate is compiled into the browser SDK, so it needs the platform clock there.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys.workspace = true

[dev-dependencies]
# Snapshot back-compatibility tests need to write a pre-0.2.2 snapshot, where
# values were msgpack strings rather than binary.
rmp-serde.workspace = true
