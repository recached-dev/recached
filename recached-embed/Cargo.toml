[package]
name        = "recached-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Hold a live slice of a Recached cache in your Rust service's own memory. Reads are local; the socket carries only writes out and change notices in."
# Depends on `core-engine` and `sync-client` by path, neither of which is
# published. Explicit rather than relying on `cargo publish` to fail on the
# missing versions.
publish = false

[dependencies]
core-engine.workspace = true
sync-client.workspace = true

tokio             = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util      = { workspace = true }
rand              = { workspace = true }
tracing           = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
core-engine.workspace = true

[lints]
workspace = true
