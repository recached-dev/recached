version: 2
updates:
  # Rust workspace. Grouped so a week of patch bumps is one PR to review, not
  # thirty.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      rust-patch-and-minor:
        update-types: ["minor", "patch"]

  # Actions are SHA-pinned, which is why this matters: a pin never picks up a
  # security fix on its own, so Dependabot is the thing that moves it.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # The docs site and the JS SDKs.
  - package-ecosystem: npm
    directory: "/docs"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/sdks/recached-react"
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: "/sdks/recached-vue"
    schedule:
      interval: weekly
