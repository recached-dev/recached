[workspace]
members = [
    "core-engine",
    "server-native",
    "sync-client",
    "wasm-edge",
]
resolver = "2"

# ── Single source of truth for all crate versions ────────────────────────────
# Members inherit with:  version.workspace = true  /  edition.workspace = true
[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
authors = ["ThinkGrid Labs"]
repository = "https://github.com/recached-dev/recached"

# ── Shared dependency versions ────────────────────────────────────────────────
# Members inherit with:  tokio.workspace = true  (add features per-crate if needed)
[workspace.dependencies]
# internal
core-engine = { path = "core-engine" }
sync-client = { path = "sync-client" }
dashmap        = "6"
indexmap       = "2"
rand           = { version = "0.9", features = ["thread_rng"] }

# async runtime
tokio          = { version = "1",     features = ["full"] }
tokio-tungstenite = "0.29.0"
futures-util   = "0.3"

# observability
tracing                      = "0.1"
tracing-subscriber           = { version = "0.3", features = ["env-filter"] }
metrics                      = "0.24"
metrics-exporter-prometheus  = { version = "0.16", features = ["http-listener"] }
tokio-rustls                 = "0.26"

# serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde  = "1"

# sync-scope tokens
hmac   = "0.12"
sha2   = "0.10"
base64 = "0.22"

# wasm
wasm-bindgen = "0.2.92"
js-sys       = "0.3.69"
web-sys      = "0.3.69"

# perf
socket2           = { version = "0.5", features = ["all"] }
num_cpus          = "1"
tikv-jemallocator = "0.6"

# ── Release profile ───────────────────────────────────────────────────────────
[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"
