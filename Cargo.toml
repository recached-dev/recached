[workspace]
members = [
    "core-engine",
    "server-native",
    "wasm-edge",
]
resolver = "2"

# ── Single source of truth for all crate versions ────────────────────────────
# Members inherit with:  version.workspace = true  /  edition.workspace = true
[workspace.package]
version = "0.1.6"
edition = "2024"
license = "MIT"
authors = ["ThinkGrid Labs"]
repository = "https://github.com/thinkgrid-labs/recached"

# ── Shared dependency versions ────────────────────────────────────────────────
# Members inherit with:  tokio.workspace = true  (add features per-crate if needed)
[workspace.dependencies]
# internal
core-engine = { path = "core-engine" }
dashmap        = "6"
rand           = { version = "0.9", features = ["thread_rng"] }

# async runtime
tokio          = { version = "1",     features = ["full"] }
tokio-tungstenite = "0.29.0"
futures-util   = "0.3"

# observability
tracing                      = "0.1"
tracing-subscriber           = { version = "0.3", features = ["env-filter"] }
metrics                      = "0.24"
metrics-exporter-prometheus  = { version = "0.16", features = ["http-listener"] }
tokio-rustls                 = "0.26"
rustls-pemfile               = "2"

# serialization
serde      = { version = "1", features = ["derive"] }
rmp-serde  = "1"

# wasm
wasm-bindgen = "0.2.92"
js-sys       = "0.3.69"
web-sys      = "0.3.69"
